<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minus">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>Minus</title>
  <style>
    :root { color-scheme: dark; --orange:#ff9f0a; --dark:#303030; --function:#666; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; width:100%; height:100%; background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; }
    body { min-height:100svh; overflow:hidden; }
    .app { height:100svh; width:100%; max-width:560px; margin:0 auto; padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
    .display { flex:1 1 auto; min-height:0; display:flex; align-items:flex-end; justify-content:center; padding:0 4px 18px; }
    .equation { display:flex; align-items:flex-end; justify-content:space-between; width:100%; gap:10px; }
    .preset { color:var(--orange); font-size:clamp(32px, 9vw, 54px); font-weight:300; white-space:nowrap; line-height:1.05; }
    .result { font-size:clamp(48px, 14vw, 76px); font-weight:300; letter-spacing:-2px; text-align:right; min-width:0; flex:1; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:clip; }
    .keys { flex:0 0 auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; padding-bottom:4px; }
    button { border:0; color:#fff; border-radius:50%; aspect-ratio:1/1; width:100%; font:300 clamp(25px,7.3vw,38px)/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; user-select:none; touch-action:manipulation; }
    button:active { filter:brightness(1.25); }
    .num { background:var(--dark); }
    .fn { background:var(--function); }
    .op { background:var(--orange); font-size:clamp(32px,8vw,42px); }
    .zero { grid-column:span 1; }
    @media (max-height:700px) {
      .app { padding-top:max(8px,env(safe-area-inset-top)); padding-bottom:max(8px,env(safe-area-inset-bottom)); }
      .display { padding-bottom:10px; }
      .keys { gap:7px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Minus-kalkylator">
    <section class="display" aria-live="polite">
      <div class="equation">
        <div class="preset" id="presetDisplay">484 −</div>
        <div class="result" id="resultDisplay">—</div>
      </div>
    </section>
    <section class="keys" aria-label="Knappar">
      <button class="fn" data-action="backspace" aria-label="Radera senaste">⌫</button>
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-action="divide">÷</button>

      <button class="num" data-digit="7">7</button>
      <button class="num" data-digit="8">8</button>
      <button class="num" data-digit="9">9</button>
      <button class="op" data-action="multiply">×</button>

      <button class="num" data-digit="4">4</button>
      <button class="num" data-digit="5">5</button>
      <button class="num" data-digit="6">6</button>
      <button class="op" data-action="subtract">−</button>

      <button class="num" data-digit="1">1</button>
      <button class="num" data-digit="2">2</button>
      <button class="num" data-digit="3">3</button>
      <button class="op" data-action="add">+</button>

      <button class="fn" data-action="sign">+/−</button>
      <button class="num zero" data-digit="0">0</button>
      <button class="num" data-action="decimal">,</button>
      <button class="op" data-action="equals">=</button>
    </section>
  </main>
  <script>
    (() => {
      const DEFAULT_PRESET = 484;
      let preset = DEFAULT_PRESET;
      let input = "";
      let lastInput = "";

      const presetDisplay = document.getElementById("presetDisplay");
      const resultDisplay = document.getElementById("resultDisplay");

      function formatNumber(value) {
        if (!Number.isFinite(value)) return "—";
        const rounded = Math.round((value + Number.EPSILON) * 1e8) / 1e8;
        return String(rounded).replace(".", ",");
      }

      function parseInput(value) {
        if (!value || value === "-" || value === "," || value === "-,") return NaN;
        return Number(value.replace(",", "."));
      }

      function render() {
        presetDisplay.textContent = formatNumber(preset) + " −";
        if (!input) {
          resultDisplay.textContent = "—";
          return;
        }
        const entered = parseInput(input);
        resultDisplay.textContent = Number.isFinite(entered) ? formatNumber(preset - entered) : "—";
      }

      function addDigit(digit) {
        if (input === "0") input = digit;
        else if (input === "-0") input = "-" + digit;
        else input += digit;
        render();
      }

      function clear() { input = ""; render(); }

      function backspace() {
        input = input.slice(0, -1);
        render();
      }

      function decimal() {
        if (!input) input = "0,";
        else if (!input.includes(",")) input += ",";
        render();
      }

      function toggleSign() {
        if (!input) input = "-";
        else if (input.startsWith("-")) input = input.slice(1);
        else input = "-" + input;
        render();
      }

      function percent() {
        const value = parseInput(input);
        if (Number.isFinite(value)) input = String(value / 100).replace(".", ",");
        render();
      }

      function setPreset() {
        const current = prompt("Förinställt tal:", String(preset).replace(".", ","));
        if (current === null) return;
        const parsed = Number(current.trim().replace(",", "."));
        if (current.trim() !== "" && Number.isFinite(parsed)) {
          preset = parsed;
          try { localStorage.setItem("minus-preset-v2", String(preset)); } catch (_) {}
          render();
        }
      }

      document.querySelector(".keys").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.digit !== undefined) { addDigit(button.dataset.digit); return; }
        switch (button.dataset.action) {
          case "clear": clear(); break;
          case "backspace": backspace(); break;
          case "decimal": decimal(); break;
          case "sign": toggleSign(); break;
          case "percent": percent(); break;
          case "equals": render(); break;
          case "subtract": setPreset(); break;
          case "add": case "multiply": case "divide":
            // Appen är avsiktligt en snabb minus-kalkylator; dessa knappar påverkar inte beräkningen.
            break;
        }
      });

      try {
        const saved = localStorage.getItem("minus-preset-v2");
        if (saved !== null && Number.isFinite(Number(saved))) preset = Number(saved);
      } catch (_) {}

      // Peka bort gammal service worker som kan visa en tidigare version.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        }).catch(() => {});
      }
      render();
    })();
  </script>
</body>
</html>
