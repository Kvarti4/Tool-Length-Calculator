<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minus">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Minus</title>
<style>
:root{color-scheme:dark;--orange:#ff9f0a;--key:#333333;--function:#636363}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overscroll-behavior:none}
body{min-height:100dvh}
.app{height:100dvh;width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;padding: max(14px,env(safe-area-inset-top)) 4.2vw max(16px,env(safe-area-inset-bottom));}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-button{width:54px;height:54px;border-radius:50%;background:#171717;border:1px solid #303030;color:white;font-size:27px;display:grid;place-items:center}
.display{flex:1;min-height:110px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:center;gap:8px;padding:0 4px 18px;overflow:hidden}
.preset{font-size:clamp(32px,9vw,52px);font-weight:400;color:var(--orange);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left;min-width:0}
.result{font-size:clamp(52px,14vw,88px);font-weight:300;letter-spacing:-2px;line-height:1.08;text-align:right;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(8px,2.2vw,13px);flex:0 0 min(58vh,690px);padding-bottom:2px}
.key{border:0;border-radius:50%;aspect-ratio:1/1;width:100%;max-height:100%;align-self:center;justify-self:center;display:flex;align-items:center;justify-content:center;color:#f7f7f7;background:var(--key);font-size:clamp(26px,8vw,43px);font-weight:400;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
.key.function{background:var(--function);color:white;font-size:clamp(21px,6vw,36px)}
.key.operator{background:var(--orange);font-size:clamp(33px,9vw,48px)}
.key:active{filter:brightness(1.25)}
.key.zero{grid-column:2}
.key.decimal{grid-column:3}
.key.equals{grid-column:4}
@media (max-height:700px){.keypad{flex-basis:56vh;gap:5px}.key{font-size:clamp(20px,6vw,34px)}.display{padding-bottom:8px}}
dialog{width:min(88vw,380px);border:1px solid #444;border-radius:22px;background:#202020;color:white;padding:22px}
dialog::backdrop{background:#000a}
.dialoghead{display:flex;align-items:center;justify-content:space-between}
.dialoghead h2{margin:0 0 18px;font-size:22px}
label{display:block;color:#bbb;font-size:14px;margin-bottom:8px}
input{width:100%;background:#101010;color:white;border:1px solid #555;border-radius:12px;padding:13px;font-size:22px}
.hint{font-size:13px;line-height:1.4;color:#aaa}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:650}
.save{background:var(--orange);color:#fff}.cancel{background:#444;color:white}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <button class="top-button" id="historyButton" aria-label="Rensa inmatning" title="Rensa inmatning">◷</button>
    <button class="top-button" id="settingsButton" aria-label="Inställningar" title="Inställningar">▦</button>
  </header>
  <section class="display" aria-live="polite">
    <div class="preset" id="presetDisplay">484 −</div>
    <output class="result" id="resultDisplay">484</output>
  </section>
  <section class="keypad" aria-label="Miniräknare">
    <button class="key function" data-key="backspace" aria-label="Radera">⌫</button>
    <button class="key function" data-key="clear">AC</button>
    <button class="key function" data-key="percent">%</button>
    <button class="key operator" data-key="divide">÷</button>

    <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key operator" data-key="multiply">×</button>
    <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key operator" data-key="minus">−</button>
    <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key operator" data-key="plus">+</button>
    <button class="key function" data-key="sign">+/−</button><button class="key zero" data-key="0">0</button><button class="key decimal" data-key="decimal">,</button><button class="key operator equals" data-key="equals">=</button>
  </section>
</main>
<dialog id="settingsDialog">
  <form id="settingsForm">
    <div class="dialoghead"><h2>Standardtal</h2></div>
    <label for="presetInput">Tal att räkna från</label>
    <input id="presetInput" inputmode="decimal" type="text" value="484" required>
    <p class="hint">Exempel: standardtal 484 och inmatning 384,5 ger 99,5.</p>
    <div class="actions"><button type="button" class="cancel" id="cancelSettings">Avbryt</button><button class="save" type="submit">Spara</button></div>
  </form>
</dialog>
<script>
(() => {
 const $=id=>document.getElementById(id);
 const parse=v=>{let s=String(v).trim().replace(/\s/g,"").replace(",",".");return s===""||s==="-"||s==="."?NaN:Number(s)};
 const fmt=n=>Number.isFinite(n)?new Intl.NumberFormat("sv-SE",{useGrouping:false,maximumFractionDigits:8}).format(n):"Fel";
 let preset=484, input="";
 try{const saved=localStorage.getItem("minus-preset");if(saved!==null&&Number.isFinite(parse(saved)))preset=parse(saved)}catch(e){}
 function render(){
  $("presetDisplay").textContent=fmt(preset)+" −";
  const n=parse(input),valid=input!===""&&Number.isFinite(n);
  $("resultDisplay").textContent=valid?fmt(preset-n):fmt(preset);
 }
 function press(k){
  if(/^\d$/.test(k)){if(input.length<20)input+=k}
  else if(k==="decimal"){if(!input.includes(",")&&!input.includes("."))input=input===""?"0,":input+","}
  else if(k==="clear")input=""
  else if(k==="backspace")input=input.slice(0,-1)
  else if(k==="sign"){if(input.startsWith("-"))input=input.slice(1);else input="-"+input}
  else if(k==="percent"){const n=parse(input);if(input!==""&&Number.isFinite(n))input=String(n/100).replace(".",",")}
  else if(k==="equals"){/* Resultatet visas redan automatiskt. */}
  else if(["divide","multiply","minus","plus"].includes(k)){/* Denna app räknar alltid standardtal minus inmatning. */}
  render();
 }
 document.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>press(b.dataset.key)));
 $("historyButton").addEventListener("click",()=>{input="";render()});
 $("settingsButton").addEventListener("click",()=>{$("presetInput").value=fmt(preset);$("settingsDialog").showModal()});
 $("cancelSettings").addEventListener("click",()=>$("settingsDialog").close());
 $("settingsForm").addEventListener("submit",e=>{e.preventDefault();const n=parse($("presetInput").value);if(!Number.isFinite(n))return;preset=n;try{localStorage.setItem("minus-preset",String(preset))}catch(e){}$("settingsDialog").close();render()});
 render();
})();
</script>
</body>
</html>
