<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minus">
  <meta name="description" content="En enkel miniräknare som räknar från ett förinställt tal.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>Minus – snabbräknare</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">SNABBRÄKNARE</p><h1>Minus</h1></div>
      <button id="settingsButton" class="icon-button" aria-label="Inställningar" title="Inställningar">⚙</button>
    </header>
    <section class="display-card" aria-live="polite">
      <p class="label">FÖRINSTÄLLT TAL</p>
      <div class="preset-line"><span id="presetDisplay">484</span><span class="minus">−</span></div>
      <p class="label entered-label">DU SKRIVER</p>
      <div id="enteredDisplay" class="entered">Skriv ett tal</div>
      <div class="divider"></div>
      <p class="label">RESULTAT</p>
      <output id="resultDisplay" class="result">—</output>
      <button id="copyButton" class="copy-button" disabled>▢ &nbsp; Kopiera resultat</button>
      <p id="copyStatus" class="copy-status" role="status"></p>
    </section>
    <section class="keypad" aria-label="Sifferknappar">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="clear" class="utility">Rensa</button><button data-key="0">0</button><button data-key="backspace" class="utility" aria-label="Radera senaste tecknet">⌫</button>
      <button data-key="decimal" class="decimal-key">,</button>
    </section>
    <p class="footnote">Skriv talet som ska dras från standardtalet. Använd komma för decimaler.</p>
  </main>
  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <div class="dialog-header"><h2>Inställningar</h2><button class="close-button" aria-label="Stäng">×</button></div>
      <label for="presetInput">Förinställt tal</label>
      <input id="presetInput" type="text" inputmode="decimal" value="484" required>
      <p class="hint">Du kan även använda decimaler, till exempel 484,5.</p>
      <div class="dialog-actions">
        <button type="button" id="resetButton" class="secondary">Återställ till 484</button>
        <button type="submit" class="save-button">Spara</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
